# Camp fees for the week. Prices are whole dollars.

# Column headings for the room table on the Apply page.
labels:
  single: { label: Single room, note: one camper }
  shared: { label: Shared with another camper, note: per camper }

# Room types, in display order.
#   single: one camper alone in the room
#   shared: price for EACH of two campers sharing the room
rooms:
  - room: 1 King
    single: 3150
    shared: 2565
  - room: 2 Queens
    single: 3095
    shared: 2535
  - room: Studio with Murphy queen and kitchenette
    single: 2995
    shared: 2485
  - room: Queen suite with Murphy queen and kitchenette
    single: 3345
    shared: 2660

# A camper who doesn't stay at the hotel. Set `draft: true` to hide it (or delete the block).
commuter:
  label: Commuter
  note: Includes dinners # TODO: confirm what commuters get (dinners? breakfasts?)
  price: 1815
  draft: true

# A partner or spouse who isn't a camper, sharing a camper's room.
# Added to the camper's single-room price, whatever the room type. `draft: true` hides it.
partner:
  price: 820
  note: "Includes breakfasts and dinners, hors d'oeuvres, and attendence to evening performances." # TODO: say what the partner gets (e.g. breakfasts and dinners); shown under the price

included: Your room, breakfasts and dinners, hors d'oeuvres, tuition and camp amenities for the whole week.
notIncluded: Travel, lunches, extra nights, private lessons, gratuities and incidentals.
