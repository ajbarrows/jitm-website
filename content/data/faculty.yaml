- id: bear-irwin
  name: Bear Irwin
  role: Staff Musician
  instrument: Trombone
  headshot: ../images/faculty/bear-irwin.jpg
  headshotAlt: Bear Irwin holding his trombone
  tracks: []
  links: []
  bio: >-
    Bear Irwin has been lead trombonist of the Vermont Jazz Ensemble since 1976.
    He taught instrumental music in public schools from 1970 until he retired in
    2015, and he also taught trombone at Middlebury College. He is a past
    president of the Vermont Music Educators Association.

- id: tony-barrows
  name: Tony Barrows
  role: Sound Technician and Media Manager
  instrument: Woodwinds
  headshot: ../images/faculty/tony-barrows.jpg
  headshotAlt: Tony Barrows playing saxophone
  tracks: []
  links: []
  bio: >-
    Tony Barrows grew up in Montpelier, Vermont, and has run sound for
    Montpelier High School productions. He plays with the Vermont Symphonic
    Winds and the Vermont Jazz Ensemble. He studied psychology at the University
    of Hartford and complex systems and data science at the University of
    Vermont. He serves on the board of the Lamoille County Players and is a
    partner in BDI Enterprises, which runs the camp.

