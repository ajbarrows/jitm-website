- id: laura-colcord
  administrator: true
  name: Laura Colcord
  role: Camp Administrator
  instrument: "Piano and keyboards"
  headshot: ../images/faculty/laura-colcord.jpg
  headshotAlt: Laura Colcord smiling in front of a white brick wall
  tracks: []
  links: []
  bio: >-
    Laura is the Camp Administrator for Jazz in the Mountains. Her family
    roots in New England go back generations, but she was born in Texas to a
    military family and lived in ten states and three countries before
    settling in New Hampshire. She holds a B.S. in chemical engineering and an
    MBA, and was a Fulbright Scholar in Germany. She spent her career as a
    management consultant specializing in process improvement, and since
    retiring in 2016 she has put those skills to work for nonprofits. She
    chaired the Boston SCORE chapter and the Board of Trustees of the Mt.
    Kearsarge Indian Museum, and serves as president of her lake association.
    She’s an avid ballroom dancer and an aspiring jazz pianist who has
    attended this camp and a predecessor camp nearly every year since 2003.

